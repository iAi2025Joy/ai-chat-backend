# monthly-exam-cache-refresh.yml
# ====================
# (filename kept for continuity even though the schedule is now DAILY
# -- see below)
#
# Free daily trigger for GARNET's School and Students exam-system
# cache refresh -- calls the protected POST /admin/refresh-exam-cache
# endpoint on the existing free Render backend, which now refreshes
# ONE rotation item per day (a single Arab country or a single
# international system -- see examSystemCacheSeedList.js and
# examSystemCacheRefresher.js for the full "why"). GitHub Actions'
# scheduled workflows are free within GitHub's standard free-tier
# minutes, which this workflow uses only a couple of per day (one
# HTTP call and a short wait).
#
# PER EXPLICIT REQUEST: changed from a monthly full-refresh burst to a
# daily single-item rotation, specifically because a monthly burst of
# ~1,280 real search queries in one sitting exceeded what a free
# search-API tier can sustain (a confirmed real failure). A single
# day's item needs only ~50 queries, which comfortably fits Google's
# real, RECURRING free daily quota (100/day) -- see
# examSystemCacheRefresher.js for the actual Google Custom Search
# integration that replaced Serper for this job specifically.
#
# SETUP REQUIRED (one-time):
#   1. In this GitHub repo -> Settings -> Secrets and variables ->
#      Actions -> New repository secret:
#        Name: EXAM_CACHE_REFRESH_SECRET
#        Value: (any long random string you make up)
#   2. In Render -> ai-chat-backend-GARNET-26 -> Environment -> add:
#        - EXAM_CACHE_REFRESH_SECRET (same value as the GitHub secret)
#        - TAVILY_API_KEY1 (from tavily.com, free, no card required)
#      then redeploy so the backend picks them up.

name: Monthly Exam System Cache Refresh

on:
  schedule:
    # Every day at 3:00 AM UTC -- one rotation item refreshed per run.
    - cron: "0 3 * * *"
  # Lets you trigger a run manually from the Actions tab too, without
  # waiting for the schedule -- useful for testing.
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger exam system cache refresh
        run: |
          # Prints the real response body either way (not just a pass/
          # fail badge -- see this workflow's own earlier history for
          # why that matters), and explicitly fails the step on
          # anything outside 200-299 so a broken run is never silently
          # green.
          response=$(curl -s -X POST "https://ai-chat-backend-garnet-26.onrender.com/admin/refresh-exam-cache" \
            -H "x-refresh-secret: ${{ secrets.EXAM_CACHE_REFRESH_SECRET }}" \
            --max-time 600 \
            -w "\nHTTP_STATUS:%{http_code}")
          echo "$response"
          status=$(echo "$response" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Refresh failed with HTTP status $status -- see the response body above for the real error."
            exit 1
          fi
